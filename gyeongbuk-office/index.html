{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as RAPIER from 'rapier';

// ---------- 기본 설정 ----------
const N = 36, HALF = N / 2;        // 짓는 땅: 36×36칸 (한 칸 = 블록 하나)
const ROADS = [Math.round(N / 3), Math.round((2 * N) / 3)];  // 도로 가운데 줄 (가로·세로 두 줄씩)
const W = 48;                      // 바닥 반지름. 이 밖으로 나간 조각은 떨어져 사라짐
const CAP = 9000;                  // 화면에 그릴 조각 수 상한 (종류별)
const DYN_CAP = 1700;              // 움직이는 조각 수 상한. 넘으면 오래 멈춘 잔해부터 치움
const STEP = 1 / 60;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const TYPES = {
  house: { name: '집', w: 2, d: 2, h: 2, walls: ['#f3e6cf', '#f6efe2', '#dfe8ef', '#f0dcc8'], roofs: ['#d9553b', '#3f6fb5', '#4f8a3a', '#8b4a3a'] },
  apt:   { name: '아파트', w: 2, d: 3, h: 7, walls: ['#e8ecef', '#f1e9dc', '#dfe6ea', '#efe2d6'] },
  tower: { name: '빌딩', w: 3, d: 3, h: 11, walls: ['#9ec5e8', '#b9d3e6', '#a7c7c9', '#c9d6e2'] },
  spire: { name: '탑', w: 1, d: 1, h: 14, walls: ['#ff8a5b', '#f2c14e', '#e45b5b'] },
  tree:  { name: '나무', w: 1, d: 1, h: 3, leaves: ['#4f9d45', '#5fb050', '#3f8a3f'] },
  // 학교 캠퍼스용 (가상의 학교)
  school: { name: '학교', w: 10, d: 3, h: 4, walls: ['#f2e8d5', '#efe3cc', '#e6e2d8', '#f3e1d0'] },
  annex:  { name: '별관', w: 3, d: 6, h: 3, walls: ['#f2e8d5', '#efe3cc', '#e6e2d8', '#f3e1d0'] },
  gym:    { name: '체육관', w: 7, d: 5, h: 3, walls: ['#dfe6ea', '#e8ecef', '#e3e7df'], roofs: ['#3f6fb5', '#2e8b7a', '#7a4fb5', '#c0573b'] },
  clock:  { name: '시계탑', w: 1, d: 1, h: 7, walls: ['#f6efe2'], cap: '#c0392b' },
  stage:  { name: '조회대', w: 3, d: 2, h: 1, walls: ['#d9d2c3'], plain: true },
  wall:   { name: '담장', w: 1, d: 1, h: 1, walls: ['#c9b79c'], plain: true },
  field:  { name: '운동장', w: 12, d: 8, h: 0, field: true },
};
const NOCOUNT = new Set(['wall', 'field', 'tree']);
const colorCache = new Map();
const col = (hex) => { let c = colorCache.get(hex); if (!c) { c = new THREE.Color(hex); colorCache.set(hex, c); } return c; };
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = (id) => document.getElementById(id);

// ---------- 화면 ----------
const app = $('app');
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY_DAY = new THREE.Color('#cfe8f3'), SKY_NIGHT = new THREE.Color('#0f1a2e');
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(SKY_DAY.clone(), 120, 240);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = 1.42;
controls.minDistance = 8;
controls.maxDistance = 140;
controls.target.set(0, 2, 0);

const hemi = new THREE.HemisphereLight('#eef8ff', '#6f9a5c', 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3dc', 2.4);
sun.position.set(26, 44, 16);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 120 });
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun);

const world = new THREE.Group();
scene.add(world);
const flash = new THREE.PointLight('#ffb070', 0, 60, 1.3);
world.add(flash);

// 땅: 바깥 잔디 + 가운데 짓는 땅(도로 두 줄)
const grass = new THREE.Mesh(new THREE.PlaneGeometry(W * 2, W * 2), new THREE.MeshLambertMaterial({ color: '#9fd08a' }));
grass.rotation.x = -Math.PI / 2; grass.position.y = -0.01; grass.receiveShadow = true;
world.add(grass);
const farGrass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: '#94c47f' }));
farGrass.rotation.x = -Math.PI / 2; farGrass.position.y = -6; scene.add(farGrass);
function lotTexture() {
  const px = 20, c = document.createElement('canvas'); c.width = c.height = N * px;
  const g = c.getContext('2d');
  g.fillStyle = '#cfe7b9'; g.fillRect(0, 0, c.width, c.height);
  for (const r of ROADS) { g.fillStyle = '#d8d2c2'; g.fillRect((r - 2) * px, 0, 4 * px, c.height); g.fillRect(0, (r - 2) * px, c.width, 4 * px); }
  for (const r of ROADS) { g.fillStyle = '#8e959c'; g.fillRect((r - 1) * px, 0, 2 * px, c.height); g.fillRect(0, (r - 1) * px, c.width, 2 * px); }
  g.fillStyle = '#f4f1e6';
  const nearRoad = (i) => ROADS.some((r) => Math.abs(i - r * px) < 2 * px);
  for (let i = 0; i < N * px; i += 24) { if (!nearRoad(i)) for (const r of ROADS) { g.fillRect(r * px - 1, i, 2, 12); g.fillRect(i, r * px - 1, 12, 2); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function schoolLotTexture() {
  const px = 20, c = document.createElement('canvas'); c.width = c.height = N * px;
  const g = c.getContext('2d');
  g.fillStyle = '#cfe7b9'; g.fillRect(0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;

}

// 레이저: 끌어서 그은 선을 빔이 따라가며 태움
let laser = null, drawing = null;
const laserLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: '#ff3b3b' }));
laserLine.visible = false; world.add(laserLine);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 80, 16, 1, true), new THREE.MeshBasicMaterial({ color: '#ff5a3c', transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));

// 지진: 규모에 따라 흔들림과 무너짐이 달라짐
let quakeT = 0, quakeAcc = 0, quakeMag = 6.5, quakeAt = new THREE.Vector3();
const QUAKE_HINTS = [

  [6, '진도 Ⅴ 정도(어림) · 꼭대기 블록이 떨어지기 시작해요'],
  [7, '진도 Ⅵ~Ⅶ 정도(어림) · 위층이 무너져요'],
  [8.5, '진도 Ⅷ~Ⅸ 정도(어림) · 건물이 통째로 무너져요'],
  [11, '진도 Ⅹ 이상(어림) · 도시 전체가 무너져요'],

const SIDES = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function openSide(p) {

}

}

}

// ---------- 입력 ----------
let mode = 'build', buildTool = 'house', smashTool = 'bomb';
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function setRay(e) {

}

let down = null;
const laserActive = () => mode === 'smash' && smashTool === 'laser';
canvas.addEventListener('pointerdown', (e) => {

let clearArm = 0;
$('bClear').addEventListener('click', () => {

let night = false;

resize();
const far = camera.aspect < 0.8;

let last = performance.now();

requestAnimationFrame(loop);
