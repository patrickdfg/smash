<style>
/* 레이아웃: 화면 전체 3D 장면 위에 장난감 블록 같은 도구판을 띄운 한 화면 앱 */
:root {
  --sky: #cfe8f3;
  --ink: #1f2b3d;
  --muted: #5d6877;
  --panel: #fffaf0;
  --edge: #d6c9ae;
  --build: #2f6fde;
  --build-dk: #1d4ea6;
  --smash: #ec5a3a;
  --smash-dk: #b03a20;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; --acc: var(--build); --acc-dk: var(--build-dk); }
#app[data-mode="smash"] { --acc: var(--smash); --acc-dk: var(--smash-dk); }
#c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.top { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 170px); }
.brand { position: relative; font-family: var(--font-display); font-size: 22px; line-height: 1; padding: 12px 14px 10px; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 0 var(--edge); letter-spacing: 0.02em; }
.brand::before { content: ""; position: absolute; top: -7px; left: 14px; width: 34px; height: 7px; background: radial-gradient(circle at 6px 7px, var(--acc) 5px, transparent 5.5px) 0 0 / 14px 7px repeat-x; }
.seg { display: flex; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 0 var(--edge); padding: 3px; gap: 3px; }
.seg button { font: 800 15px var(--font-body); border: 0; border-radius: 7px; padding: 9px 14px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--acc); color: #fff; }

.stats { position: absolute; top: 16px; right: 16px; min-width: 132px; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 0 var(--edge); padding: 10px 12px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.stats .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.stats .big { font-family: var(--font-display); font-size: 26px; line-height: 1.05; display: flex; align-items: baseline; gap: 6px; }
.stats .combo { font: 800 13px var(--font-body); color: var(--smash); }
.meter { height: 8px; border-radius: 4px; background: #ece3cf; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--smash); transition: width .2s; }
.stats .small { font-size: 12px; font-weight: 700; color: var(--muted); }

.bar { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: safe center; gap: 8px; overflow-x: auto; padding: 8px 4px 10px; scrollbar-width: none; }
.bar::-webkit-scrollbar { display: none; }
.sep { flex: 0 0 2px; background: var(--edge); border-radius: 1px; margin: 6px 2px; }
.tool { flex: 0 0 auto; min-width: 64px; height: 64px; padding: 0 10px; white-space: nowrap; display: grid; place-items: center; align-content: center; gap: 3px; background: var(--panel); color: var(--ink); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 4px 0 var(--edge); font: 800 12px var(--font-body); cursor: pointer; transition: transform .06s; }
.tool svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { background: var(--acc); color: #fff; border-color: var(--acc-dk); box-shadow: 0 4px 0 var(--acc-dk); }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.tool.warn { color: var(--smash-dk); }
.tool:focus-visible, .seg button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.toast { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); background: var(--ink); color: #fff; font: 700 13px var(--font-body); padding: 8px 14px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
@media (max-width: 460px) {
  .brand { font-size: 18px; padding: 10px 10px 8px; }
  .seg button { padding: 8px 10px; font-size: 14px; }
  .top { max-width: calc(100% - 156px); }
  .stats { min-width: 104px; padding: 8px 10px; }
  .stats .big { font-size: 22px; }
}
</style>

<div id="app" data-mode="build">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 기본 설정 ----------
const N = 24, HALF = N / 2;        // 짓는 땅: 24×24칸 (한 칸 = 블록 하나)
const W = 30, W2 = W * 2;          // 조각이 굴러다닐 수 있는 범위
const G = 22;                      // 중력
const CAP = 12000, MAXP = 15000;   // 조각 수 상한
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const TYPES = {
  house: { name: '집', w: 2, d: 2, h: 2, walls: ['#f3e6cf', '#f6efe2', '#dfe8ef', '#f0dcc8'], roofs: ['#d9553b', '#3f6fb5', '#4f8a3a', '#8b4a3a'] },
  apt:   { name: '아파트', w: 2, d: 3, h: 7, walls: ['#e8ecef', '#f1e9dc', '#dfe6ea', '#efe2d6'] },
  tower: { name: '빌딩', w: 3, d: 3, h: 11, walls: ['#9ec5e8', '#b9d3e6', '#a7c7c9', '#c9d6e2'] },
  spire: { name: '탑', w: 1, d: 1, h: 14, walls: ['#ff8a5b', '#f2c14e', '#e45b5b'] },
  tree:  { name: '나무', w: 1, d: 1, h: 3, leaves: ['#4f9d45', '#5fb050', '#3f8a3f'] },
};
const colorCache = new Map();
const col = (hex) => { let c = colorCache.get(hex); if (!c) { c = new THREE.Color(hex); colorCache.set(hex, c); } return c; };

// ---------- 화면 ----------
const app = document.getElementById('app');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY = new THREE.Color('#cfe8f3');
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 75, 160);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = 1.42;
controls.minDistance = 8;
controls.maxDistance = 90;
controls.target.set(0, 2, 0);

scene.add(new THREE.HemisphereLight('#eef8ff', '#6f9a5c', 1.5));
const sun = new THREE.DirectionalLight('#fff3dc', 2.4);
sun.position.set(20, 34, 12);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 90 });
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun);

const world = new THREE.Group();
scene.add(world);
const flash = new THREE.PointLight('#ffb070', 0, 40, 1.4);
world.add(flash);

// 땅: 바깥 잔디 + 가운데 짓는 땅(도로 두 줄)
const grass = new THREE.Mesh(new THREE.PlaneGeometry(W2 * 2.4, W2 * 2.4), new THREE.MeshLambertMaterial({ color: '#9fd08a' }));
grass.rotation.x = -Math.PI / 2; grass.position.y = -0.01; grass.receiveShadow = true;
world.add(grass);
function lotTexture() {
  const px = 20, c = document.createElement('canvas'); c.width = c.height = N * px;
  const g = c.getContext('2d');
  g.fillStyle = '#cfe7b9'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#d8d2c2'; g.fillRect(10 * px, 0, 4 * px, c.height); g.fillRect(0, 10 * px, c.width, 4 * px);
  g.fillStyle = '#8e959c'; g.fillRect(11 * px, 0, 2 * px, c.height); g.fillRect(0, 11 * px, c.width, 2 * px);
  g.fillStyle = '#f4f1e6';
  for (let i = 0; i < N * px; i += 24) { if (Math.abs(i - 12 * px) > 2 * px) { g.fillRect(12 * px - 1, i, 2, 12); g.fillRect(i, 12 * px - 1, 12, 2); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const lot = new THREE.Mesh(new THREE.PlaneGeometry(N, N), new THREE.MeshLambertMaterial({ map: lotTexture() }));
lot.rotation.x = -Math.PI / 2; lot.receiveShadow = true;
world.add(lot);
const grid = new THREE.GridHelper(N, N, '#6f9a5c', '#8fb87d');
grid.position.y = 0.02; grid.material.transparent = true; grid.material.opacity = 0.55;
world.add(grid);

// 블록: 창문 있는 벽 블록 / 무늬 없는 블록, 두 종류를 인스턴스로 한 번에 그림
function windowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#7d93ad'; g.fillRect(14, 12, 36, 38);
  g.fillStyle = '#a9bdd2'; g.fillRect(14, 12, 36, 9);
  g.fillStyle = '#eef2f6'; g.fillRect(31, 12, 2, 38);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const sideMat = new THREE.MeshLambertMaterial({ map: windowTexture() });
const flatMat = new THREE.MeshLambertMaterial({ color: '#ffffff' });
const meshes = [
  new THREE.InstancedMesh(boxGeo, [sideMat, sideMat, flatMat, flatMat, sideMat, sideMat], CAP),
  new THREE.InstancedMesh(boxGeo, flatMat, CAP),
];
for (const m of meshes) {
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.setColorAt(0, col('#ffffff'));
  m.count = 0; m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
  m.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 300);
  world.add(m);
}

// 미리보기 상자 (마우스로 짓기 모드일 때)
const ghost = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: '#2f6fde', transparent: true, opacity: 0.35, depthWrite: false }));
ghost.visible = false; world.add(ghost);

// ---------- 조각 관리 ----------
const lists = [[], []];
const dirty = [false, false], cdirty = [false, false];
const staticMap = new Map();
const colTop = new Int16Array(N * N);       // 칸마다 서 있는 블록 높이
const debTop = new Float32Array(W2 * W2);   // 칸마다 쌓인 잔해 높이
const cellSleep = new Map();
const queue = [];
let totalStatic = 0, broken = 0;

const M4 = new THREE.Matrix4(), V = new THREE.Vector3(), SV = new THREE.Vector3(), TQ = new THREE.Quaternion();
const key = (i, j, k) => i + k * N + j * N * N;
const hidx = (x, z) => Math.floor(x + W) + Math.floor(z + W) * W2;
const rnd = (a, b) => a + Math.random() * (b - a);

function writeM(p) {
  V.set(p.x, p.y, p.z); SV.setScalar(p.s); M4.compose(V, p.q, SV);
  meshes[p.m].setMatrixAt(p.slot, M4); dirty[p.m] = true;
}
function addPiece(x, y, z, s, color, m) {
  const L = lists[m];
  if (L.length >= CAP) return null;
  const p = { x, y, z, s, color, m, slot: L.length, q: new THREE.Quaternion(), vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0, state: 0, rest: 0, cell: -1, key: -1, gi: 0, gj: 0, gk: 0, bid: -1 };
  L.push(p); meshes[m].count = L.length;
  writeM(p); meshes[m].setColorAt(p.slot, color); cdirty[m] = true;
  return p;
}
function removePiece(p) {
  if (p.state === 2) unsleep(p);
  if (p.state === 0) staticMap.delete(p.key);
  const L = lists[p.m], last = L.pop();
  if (last !== p) { L[p.slot] = last; last.slot = p.slot; writeM(last); meshes[p.m].setColorAt(last.slot, last.color); cdirty[p.m] = true; }
  meshes[p.m].count = L.length; dirty[p.m] = true; p.state = -1;
}
const pieceCount = () => lists[0].length + lists[1].length;

function floorAt(x, z) {
  const hx = Math.floor(x + W), hz = Math.floor(z + W);
  if (hx < 0 || hz < 0 || hx >= W2 || hz >= W2) return -100;
  let f = debTop[hx + hz * W2];
  const i = Math.floor(x + HALF), k = Math.floor(z + HALF);
  if (i >= 0 && k >= 0 && i < N && k < N) { const t = colTop[i + k * N]; if (t > f) f = t; }
  return f;
}
function sleep(p) {
  p.state = 2; p.vx = p.vy = p.vz = p.wx = p.wy = p.wz = 0;
  const h = hidx(p.x, p.z); p.cell = h;
  let set = cellSleep.get(h); if (!set) { set = new Set(); cellSleep.set(h, set); }
  set.add(p);
  debTop[h] = Math.max(debTop[h], p.y + p.s * 0.45);
}
function unsleep(p) {
  const set = cellSleep.get(p.cell);
  if (set) {
    set.delete(p);
    let t = 0; for (const o of set) t = Math.max(t, o.y + o.s * 0.45);
    debTop[p.cell] = t;
  }
  p.cell = -1;
}
function wake(p, vx, vy, vz) {
  if (p.state === 2) unsleep(p);
  p.state = 1; p.rest = 0; p.vx += vx; p.vy += vy; p.vz += vz;
}
function wakeCell(h) {
  const set = cellSleep.get(h); if (!set) return;
  for (const p of [...set]) wake(p, rnd(-0.5, 0.5), 0.5, rnd(-0.5, 0.5));
}

// 서 있는 블록을 떼어 냄. 위에 얹힌 블록은 차례로 무너짐
function detach(p, vx, vy, vz, spin = 4) {
  if (p.state !== 0) return;
  staticMap.delete(p.key);
  p.state = 1; p.rest = 0; p.vx = vx; p.vy = vy; p.vz = vz;
  p.wx = rnd(-spin, spin); p.wy = rnd(-spin, spin); p.wz = rnd(-spin, spin);
  broken++; score += 10 * combo;
  const c = p.gi + p.gk * N;
  if (p.gj < colTop[c]) {
    const old = colTop[c]; colTop[c] = p.gj;
    for (let j = p.gj + 1; j < old; j++) {
      const q = staticMap.get(key(p.gi, j, p.gk));
      if (q) queue.push({ p: q, t: clock + (j - p.gj) * 0.035 + Math.random() * 0.06 });
    }
    wakeCell(hidx(p.x, p.z));
  }
}
function hitWall(nx, ny, nz, p) {
  const i = Math.floor(nx + HALF), k = Math.floor(nz + HALF), j = Math.floor(ny);
  if (i < 0 || k < 0 || i >= N || k >= N || j < 0) return 0;
  const q = staticMap.get(key(i, j, k));
  if (!q) return 0;
  detach(q, p.vx * 0.6, p.vy * 0.3 + 1, p.vz * 0.6, 6);
  return 1;
}
function split(p) {
  if (p.s < 0.4 || pieceCount() > MAXP) return false;
  const o = p.s / 4, hs = p.s / 2;
  for (const dx of [-1, 1]) for (const dy of [-1, 1]) for (const dz of [-1, 1]) {
    V.set(dx * o, dy * o, dz * o).applyQuaternion(p.q);
    const c = addPiece(p.x + V.x, p.y + V.y, p.z + V.z, hs, p.color, p.m);
    if (!c) break;
    c.q.copy(p.q); c.state = 1;
    c.vx = p.vx + V.x * 8; c.vy = p.vy + V.y * 8 + 1; c.vz = p.vz + V.z * 8;
    c.wx = rnd(-8, 8); c.wy = rnd(-8, 8); c.wz = rnd(-8, 8);
    writeM(c);
  }
  removePiece(p);
  return true;
}

function stepPhysics(dt) {
  let chain = 0;
  for (const m of [0, 1]) {
    const L = lists[m];
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      if (!p || p.state !== 1) continue;
      p.vy -= G * dt;
      const half = p.s / 2;
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt, nz = p.z + p.vz * dt;
      if (ny < -30 || Math.abs(nx) >= W - 0.01 || Math.abs(nz) >= W - 0.01) { removePiece(p); continue; }
      const fl = floorAt(nx, nz);

function explode(cx, cy, cz, R, power) {
  const targets = [];
  for (const p of staticMap.values()) {
    const dx = p.x - cx, dy = p.y - cy, dz = p.z - cz, d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < R * R) targets.push([p, Math.sqrt(d2), dx, dy, dz]);
  }
  const loose = [];

  for (const L of lists) for (const p of L) {
    if (p.state !== 1 && p.state !== 2) continue;
    const dx = p.x - cx, dy = p.y - cy, dz = p.z - cz, d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < R2 * R2) loose.push([p, Math.sqrt(d2), dx, dy, dz]);
  }

    const f = power * (1 - d / R) * rnd(0.7, 1.3) + 2, inv = 1 / (d || 1);

  const from = new THREE.Vector3(pt.x - 26, 46, pt.z - 18);

function updateStats() {
  $('sBuildings').textContent = `${layout.length}채`;
  $('sBlocks').textContent = `블록 ${totalStatic.toLocaleString('ko-KR')}개`;
}
let shownScore = -1, shownBroken = -1, shownCombo = -1;
function updateHud() {
  if (mode !== 'smash') return;
  if (score !== shownScore) { $('sScore').textContent = score.toLocaleString('ko-KR'); shownScore = score; }
  const c = clock - lastAct < 2.5 ? combo : 1;
  if (c !== shownCombo) { $('sCombo').textContent = c > 1 ? `×${c}` : ''; shownCombo = c; }
  if (broken !== shownBroken) {
    const r = totalStatic ? Math.min(100, Math.round((broken / totalStatic) * 100)) : 0;
    $('sMeter').style.width = r + '%'; $('sRate').textContent = `파괴율 ${r}%`; shownBroken = broken;
  }
}

// ---------- 크기 맞추기와 반복 ----------
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
const far = camera.aspect < 0.8;
camera.position.set(far ? 30 : 24, far ? 34 : 22, far ? 40 : 28);
controls.update();

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - last) / 1000); last = now; clock += dt;
  for (let i = queue.length - 1; i >= 0; i--) {
    if (queue[i].t <= clock) { const q = queue[i].p; queue.splice(i, 1); if (q.state === 0) detach(q, rnd(-1.2, 1.2), -1, rnd(-1.2, 1.2), 2); }
  }
  updateQuake(dt); updateMeteors(dt);
  stepPhysics(dt / 2); stepPhysics(dt / 2);
  updateParts(dt);
  flash.intensity *= 0.86;
  if (shake > 0.005 && !reduceMotion) { world.position.set(rnd(-shake, shake), rnd(-shake, shake) * 0.5, rnd(-shake, shake)); shake *= 0.9; }
  else { world.position.set(0, 0, 0); shake = 0; }
  for (const m of [0, 1]) {
    if (dirty[m]) { meshes[m].instanceMatrix.needsUpdate = true; dirty[m] = false; }
    if (cdirty[m]) { meshes[m].instanceColor.needsUpdate = true; cdirty[m] = false; }
  }
  controls.update();
  renderer.render(scene, camera);
  updateHud();
}

layout = load() || [];
if (!layout.length) randomCity();
buildCity();
requestAnimationFrame(loop);
window.__blockcity = { explode, setMode, staticCount: () => staticMap.size, pieces: pieceCount };
</script>
