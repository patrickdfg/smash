<!-- 예천 호명초등학교 3D 파괴 게임의 독립 실행형 시제품입니다. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>호명초 3D 부수기 · 지도 윤곽 적용</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#f8fafc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b2b}#view{position:absolute;inset:0}canvas{display:block}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;align-items:start;padding:16px;pointer-events:none}.top>*{pointer-events:auto}.brand{background:#0b1523d9;border:1px solid #ffffff30;border-radius:16px;padding:11px 15px;backdrop-filter:blur(10px)}h1{font-size:19px;margin:0 0 3px}.brand small{color:#cbd5e1;font-size:11px}.score{text-align:right;background:#0b1523d9;border:1px solid #ffffff30;border-radius:15px;padding:10px 14px;font-size:12px}.score strong{font-size:25px;color:#fbbf24;display:block;font-variant-numeric:tabular-nums}.dock{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#0b1523e8;border:1px solid #ffffff2b;border-radius:20px;box-shadow:0 15px 40px #0005;max-width:calc(100% - 16px);overflow:auto}.tool{border:1px solid transparent;border-radius:13px;background:#243249;color:white;min-width:65px;min-height:63px;padding:7px;cursor:pointer;font-weight:700;font-size:12px}.tool span{display:block;font-size:23px;margin-bottom:2px}.tool.active{background:#f6b94d;color:#172033;border-color:#fff}.tool:focus-visible{outline:2px solid white}.notice{position:absolute;top:150px;left:16px;max-width:330px;background:#0b1523c9;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.65;color:#d7e4f5}.help{position:absolute;right:16px;bottom:105px;background:#0b1523c9;padding:8px 11px;border-radius:10px;font-size:11px;color:#d7e4f5}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}a{color:#9ed9ff}.back-link{display:inline-block;margin-top:8px;color:#fff;background:#315779;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:12px;font-weight:700} @media(max-width:620px){.top{padding:8px}.brand{padding:8px 10px}h1{font-size:15px}.brand small{font-size:9px}.score{padding:6px 9px}.score strong{font-size:20px}.notice{top:138px;left:8px;max-width:230px;font-size:10px}.help{display:none}.dock{width:calc(100% - 12px);justify-content:space-around}.tool{min-width:58px;padding:6px;font-size:11px}}
</style>
</head>
<body>
<div id="view"></div>
<header class="top"><div class="brand"><h1>🏫 호명초 3D 부수기</h1><small>예천 호명초등학교 · 실제 지도 윤곽 적용</small><div><a class="back-link" href="../">← 블록시티로 돌아가기</a></div></div><div class="score">점수<strong id="points">0</strong><span id="percent">파괴율 0%</span></div></header>
<div class="notice">⚠️ 실제 OSM 교사동 윤곽을 적용했습니다.<br>층수·외벽 색상은 추가 확인이 필요합니다.<br>건물을 누르거나 터치해서 부숴 보세요.</div>
<div class="help">드래그: 회전 · 휠/두 손가락: 확대 · 1~3: 도구</div>
<nav class="dock" aria-label="게임 도구">
<button class="tool active" data-tool="bomb"><span>💣</span>폭탄</button>
<button class="tool" data-tool="ball"><span>⚾</span>철구</button>
<button class="tool" data-tool="laser"><span>⚡</span>레이저</button>
<button class="tool" id="night"><span>🌙</span>밤</button>
<button class="tool" id="reset"><span>↩️</span>복구</button>
</nav><div class="flash" id="flash"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa6d8f0);scene.fog=new THREE.Fog(0xa6d8f0,120,270);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('view').appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);let yaw=.65,pitch=.67,dist=120;const target=new THREE.Vector3(0,4,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x60708a,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(-45,95,55);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-110;sun.shadow.camera.right=110;sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.78});const green=mat(0x77a977),asphalt=mat(0x6b7480),roadline=mat(0xe5edf4),track=mat(0xc7855a),lawn=mat(0x4c8d65);
function cube(w,h,d,x,y,z,m,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;o.castShadow=true;parent.add(o);return o}
cube(180,1,140,0,-.7,0,green);cube(153,.25,112,0,-.09,0,lawn);cube(151,.08,8,0,.02,57,asphalt);cube(8,.08,112,70,.02,0,asphalt);
const field=cube(54,.16,39,0,.1,-44,track);cube(37,.18,21,0,.21,-44,green);
for(const z of [-54.5,-33.5]) cube(37,.03,.28,0,.33,z,roadline);
cube(.25,.03,21,-18.5,.34,-44,roadline);cube(.25,.03,21,18.5,.34,-44,roadline);
const white=mat(0xe4e9e8),cream=mat(0xe6d5b7),brick=mat(0xc9896a),windowMat=mat(0x568da1),roof=mat(0x57687b),shade=mat(0xb3becb),trunk=mat(0x795839),leaf=mat(0x4e9463);
for(let i=0;i<33;i++){let x=-69+(i%12)*12,z=i<12?-49:i<23?49:-40+(i-23)*9;let tree=new THREE.Group();tree.position.set(x,0,z);scene.add(tree);cube(.65,3,.65,0,1.5,0,trunk,tree);const canopy=new THREE.Mesh(new THREE.IcosahedronGeometry(2.4,1),leaf);canopy.position.y=4.5;tree.add(canopy)}
const osmSchool = {
  source: '© OpenStreetMap contributors (ODbL 1.0)',
  origin: [128.4793, 36.5789],
  boundary: [[128.4784995,36.5782062],[128.4785279,36.5797563],[128.4788592,36.5794655],[128.4801067,36.5794637],[128.4801106,36.5789019],[128.4800822,36.5787873],[128.4801433,36.5784247],[128.480101,36.5783524]],
  building: [[128.4788819,36.578868],[128.4799555,36.5788569],[128.4799579,36.5790106],[128.479513,36.5790152],[128.4795156,36.5791776],[128.4799191,36.5791734],[128.4799229,36.5794072],[128.4791833,36.579415],[128.479182,36.579338],[128.4789399,36.5793405],[128.4789383,36.5792406],[128.4793064,36.5792368],[128.4793029,36.5790189],[128.4788844,36.5790231]]
};
const toMeters=([lon,lat])=>new THREE.Vector2((lon-osmSchool.origin[0])*89300,(lat-osmSchool.origin[1])*111000);
const footprint=osmSchool.building.map(toMeters);
const boundary=osmSchool.boundary.map(toMeters);
let buildingGroups=[];
function makeSchool(){
  for(const o of [...blocks,...debris]){if(o.parent)o.parent.remove(o);o.geometry.dispose()}
  for(const g of buildingGroups)scene.remove(g);
  buildingGroups=[];blocks=[];debris=[];total=0;broken=0;score=0;
  const group=new THREE.Group();scene.add(group);buildingGroups.push(group);
  const floorHeight=3.3, floors=4; // 정확한 층수 자료 확보 전 임시값
  for(let floor=0;floor<floors;floor++){
    for(let i=0;i<footprint.length;i++){
      const a=footprint[i],b=footprint[(i+1)%footprint.length];
      const dx=b.x-a.x,dz=b.y-a.y,len=Math.hypot(dx,dz),parts=Math.max(1,Math.ceil(len/3.5));
      for(let j=0;j<parts;j++){
        const t=(j+.5)/parts;
        const color=(j%4===1)?windowMat:(floor===0?cream:white);
        const o=cube(len/parts-.07,floorHeight-.08,.72,a.x+dx*t,floorHeight*(floor+.5),a.y+dz*t,color,group);
        o.rotation.y=-Math.atan2(dz,dx);
        o.userData={building:'호명초 교사동',alive:true,velocity:new THREE.Vector3(),spin:new THREE.Vector3()};
        blocks.push(o);total++;
      }
    }
  }
  const shape=new THREE.Shape();footprint.forEach((p,i)=>i?shape.lineTo(p.x,p.y):shape.moveTo(p.x,p.y));shape.closePath();
  const roofGeometry=new THREE.ShapeGeometry(shape);
  const roofMesh=new THREE.Mesh(roofGeometry,new THREE.MeshStandardMaterial({color:0x657587,side:THREE.DoubleSide,roughness:.7}));
  roofMesh.rotation.x=Math.PI/2;roofMesh.position.y=floors*floorHeight+.3;
  roofMesh.castShadow=true;roofMesh.receiveShadow=true;group.add(roofMesh);
  roofMesh.userData={building:'호명초 교사동',alive:true,velocity:new THREE.Vector3(),spin:new THREE.Vector3()};
  blocks.push(roofMesh);total++;
  updateScore();
}
function updateScore(){document.getElementById('points').textContent=score.toLocaleString('ko-KR');document.getElementById('percent').textContent='파괴율 '+(total?Math.round(broken/total*100):0)+'%'}
makeSchool();
function updateCamera(){pitch=Math.max(.22,Math.min(1.42,pitch));dist=Math.max(28,Math.min(225,dist));camera.position.set(target.x+dist*Math.sin(pitch)*Math.sin(yaw),target.y+dist*Math.cos(pitch),target.z+dist*Math.sin(pitch)*Math.cos(yaw));camera.lookAt(target)}
updateCamera();
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();function pick(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(blocks.filter(b=>b.userData.alive),false);return hit[0]?.point??null}
function burst(at,power){let count=0;for(const o of blocks){if(!o.userData.alive)continue;const world=new THREE.Vector3();o.getWorldPosition(world);const d=world.distanceTo(at);if(d>power)continue;const chance=tool==='laser'?.74:1;if(Math.random()>chance)continue;
o.userData.alive=false;const pos=world.clone();o.parent.remove(o);scene.add(o);o.position.copy(pos);const v=pos.clone().sub(at).normalize().multiplyScalar((power-d+2)*(tool==='ball'?.26:.48));v.y+=3+Math.random()*4;o.userData.velocity=v;o.userData.spin.set((Math.random()-.5)*2,(Math.random()-.5)*2,(Math.random()-.5)*2);debris.push(o);broken++;count++}score+=count*(tool==='laser'?15:10);updateScore();const ring=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),new THREE.MeshBasicMaterial({color:tool==='laser'?0x72e4ff:0xffb65b,transparent:true,opacity:.38,depthWrite:false}));ring.position.copy(at);scene.add(ring);explosions.push({o:ring,life:0,max:power});if(tool==='bomb'){const fl=document.getElementById('flash');fl.style.opacity='.45';setTimeout(()=>fl.style.opacity='0',55)}}
function act(e){const p=pick(e);if(p)burst(p,tool==='ball'?7:tool==='laser'?5:12)}
let start,drag=false;renderer.domElement.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,yaw,pitch};drag=false;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5)drag=true;if(drag){yaw=start.yaw-dx*.008;pitch=start.pitch+dy*.008;updateCamera()}});
renderer.domElement.addEventListener('pointerup',e=>{if(start&&!drag)act(e);start=null});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist*=e.deltaY>0?1.1:.9;updateCamera()},{passive:false});
let pinch=null;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,len=Math.hypot(dx,dy);if(pinch)dist*=pinch/len;pinch=len;updateCamera()}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=null);
function setTool(next){tool=next;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool))}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.getElementById('reset').onclick=makeSchool;
document.getElementById('night').onclick=()=>{isNight=!isNight;scene.background.setHex(isNight?0x101a34:0xa6d8f0);scene.fog.color.setHex(isNight?0x101a34:0xa6d8f0);sun.intensity=isNight?.4:2.6};
addEventListener('keydown',e=>{if('123'.includes(e.key))setTool(['bomb','ball','laser'][+e.key-1]);if(e.key.toLowerCase()==='r')makeSchool()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.045);for(const o of debris){const v=o.userData.velocity;v.y-=22*dt;o.position.addScaledVector(v,dt);o.rotation.x+=o.userData.spin.x*dt;o.rotation.z+=o.userData.spin.z*dt;if(o.position.y<.4){o.position.y=.4;v.y*=-.22;v.x*=.81;v.z*=.81;if(Math.abs(v.y)<.35)v.set(0,0,0)}}for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.life+=dt*2.5;e.o.scale.setScalar(1+e.life*e.max);e.o.material.opacity=Math.max(0,.36*(1-e.life));if(e.life>=1){scene.remove(e.o);e.o.geometry.dispose();e.o.material.dispose();explosions.splice(i,1)}}renderer.render(scene,camera)}animate();
</script></body></html>
